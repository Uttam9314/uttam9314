<svg width="100%" viewBox="0 0 680 230" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Midnight Slate & Indigo/Purple Void -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="50%" stop-color="#14112c"/>
      <stop offset="100%" stop-color="#1c1236"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <title>Uttam Kumar – GitHub Profile Banner</title>
  <desc>Deep midnight indigo banner with neural LLM and NLP research focus</desc>

  <!-- Base Canvas -->
  <rect width="680" height="230" fill="url(#bgGrad)" rx="8"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="100" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="560" cy="80" r="110" fill="#06b6d4" opacity="0.10" filter="url(#glow)"/>
  <circle cx="340" cy="200" r="90" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Neural Network Synapse & Transformer Attention Pattern -->
  <g opacity="0.38">
    <line x1="80" y1="45" x2="150" y2="25" stroke="#8b5cf6" stroke-width="0.7"/>
    <line x1="150" y1="25" x2="220" y2="40" stroke="#8b5cf6" stroke-width="0.7"/>
    <line x1="220" y1="40" x2="290" y2="20" stroke="#06b6d4" stroke-width="0.7"/>
    <line x1="390" y1="22" x2="460" y2="35" stroke="#06b6d4" stroke-width="0.7"/>
    <line x1="460" y1="35" x2="540" y2="20" stroke="#a855f7" stroke-width="0.7"/>
    <line x1="540" y1="20" x2="610" y2="48" stroke="#a855f7" stroke-width="0.7"/>

    <line x1="150" y1="25" x2="180" y2="70" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="540" y1="20" x2="510" y2="65" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="60" y1="130" x2="110" y2="160" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="580" y1="150" x2="630" y2="120" stroke="#06b6d4" stroke-width="0.5"/>

    <!-- Neural Nodes -->
    <circle cx="80" cy="45" r="2.5" fill="#a78bfa"/>
    <circle cx="150" cy="25" r="3" fill="#c084fc"/>
    <circle cx="220" cy="40" r="2" fill="#818cf8"/>
    <circle cx="290" cy="20" r="2.5" fill="#38bdf8"/>
    <circle cx="390" cy="22" r="2.5" fill="#38bdf8"/>
    <circle cx="460" cy="35" r="2" fill="#818cf8"/>
    <circle cx="540" cy="20" r="3" fill="#c084fc"/>
    <circle cx="610" cy="48" r="2.5" fill="#f472b6"/>
    <circle cx="180" cy="70" r="2" fill="#818cf8"/>
    <circle cx="510" cy="65" r="2" fill="#818cf8"/>
    <circle cx="60" cy="130" r="2" fill="#c084fc"/>
    <circle cx="110" cy="160" r="2" fill="#38bdf8"/>
    <circle cx="580" cy="150" r="2" fill="#38bdf8"/>
    <circle cx="630" cy="120" r="2" fill="#f472b6"/>
  </g>

  <!-- Flow Wave Lines at Bottom -->
  <path d="M0 205 Q90 190 180 200 Q270 210 360 195 Q450 180 540 196 Q610 208 680 195 L680 230 L0 230 Z" fill="#1e1b4b" opacity="0.6"/>
  <path d="M0 214 Q100 200 210 210 Q320 220 430 205 Q540 192 680 208 L680 230 L0 230 Z" fill="#2e1065" opacity="0.45"/>

  <!-- Title: UTTAM KUMAR -->
  <text x="340" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="6">UTTAM KUMAR</text>

  <!-- Subtitle: Academic & Research Affiliations -->
  <text x="340" y="106" text-anchor="middle" font-family="'Courier New', monospace" font-size="11.5" font-weight="500" fill="#a78bfa" letter-spacing="2">IIT PATNA  ·  IISER BHOPAL INTERN  ·  NIT PATNA INTERN</text>

  <!-- Decorative Separator Line -->
  <line x1="160" y1="118" x2="520" y2="118" stroke="url(#cyanPurpleGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Core Research Domains -->
  <text x="340" y="137" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.8" font-weight="500" fill="#38bdf8" letter-spacing="1">Large Language Models (LLMs)  ·  Deep Learning  ·  NLP  ·  Explainable AI</text>

  <!-- Badge Pills -->
  <g transform="translate(0, 5)">
    <!-- Pill 1: Publications -->
    <rect x="75" y="148" width="165" height="23" rx="11.5" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.9"/>
    <text x="157" y="163.5" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#e2e8f0" font-weight="700">2 IEEE PAPERS PUBLISHED</text>

    <!-- Pill 2: 4x Hackathon Winner -->
    <rect x="250" y="148" width="180" height="23" rx="11.5" fill="#1e1b4b" stroke="#ec4899" stroke-width="0.9"/>
    <text x="340" y="163.5" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#fbcfe8" font-weight="700">🏆 4x HACKATHON WINNER</text>

    <!-- Pill 3: CGPA -->
    <rect x="440" y="148" width="165" height="23" rx="11.5" fill="#1e1b4b" stroke="#06b6d4" stroke-width="0.9"/>
    <text x="522" y="163.5" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#cffafe" font-weight="700">IIT PATNA (CGPA 9.51)</text>
  </g>

  <!-- Bottom Technical Tagline -->
  <text x="340" y="212" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.8" fill="#94a3b8" opacity="0.85" letter-spacing="1.2">TRANSFORMERS  ·  MODEL QUANTIZATION (GGUF)  ·  INTERPRETABLE AI (SHAP)  ·  PROMPT ENG</text>
</svg>
